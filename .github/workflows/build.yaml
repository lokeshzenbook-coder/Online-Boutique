name: Build & Test

"on":
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            path: src/adservice
            lang: java
          - service: cartservice
            path: src/cartservice/src
            lang: dotnet
          - service: checkoutservice
            path: src/checkoutservice
            lang: go
          - service: currencyservice
            path: src/currencyservice
            lang: node
          - service: emailservice
            path: src/emailservice
            lang: python
          - service: frontend
            path: src/frontend
            lang: go
          - service: loadgenerator
            path: src/loadgenerator
            lang: python
          - service: paymentservice
            path: src/paymentservice
            lang: node
          - service: productcatalogservice
            path: src/productcatalogservice
            lang: go
          - service: recommendationservice
            path: src/recommendationservice
            lang: python
          - service: shippingservice
            path: src/shippingservice
            lang: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.path }}/go.mod

      - name: Setup Node.js
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- Java Build & Test ---
      - name: Java Build
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test -x verifyGoogleJavaFormat

      - name: Java Test
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x gradlew
          ./gradlew test || true

      # --- Go Build & Test ---
      - name: Go Download Modules
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: go mod download

      - name: Go Build
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: CGO_ENABLED=0 go build -v ./...

      - name: Go Test
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: CGO_ENABLED=0 go test -v -count=1 ./... || true

      # --- Node.js Build & Test ---
      - name: Node Install
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.path }}
        run: npm ci || npm install

      - name: Node Test
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.path }}
        run: npm test --if-present || true

      # --- Python Build & Test ---
      - name: Python Install System Dependencies
        if: matrix.lang == 'python'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ python3-dev cmake make

      - name: Python Install
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: pip install -r requirements.txt

      - name: Python Test
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pip install pytest
          pytest --tb=short || true

      # --- .NET Build & Test ---
      - name: .NET Build
        if: matrix.lang == 'dotnet'
        working-directory: ${{ matrix.path }}
        run: dotnet build -c Release

      - name: .NET Test
        if: matrix.lang == 'dotnet'
        working-directory: ${{ matrix.path }}
        run: dotnet test -c Release --no-build || true
