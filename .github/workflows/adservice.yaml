name: AdService CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sort

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build AdService
        working-directory: ./adservice
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Test AdService
        working-directory: ./adservice
        run: |
          ./gradlew test

      - name: ESLint
        working-directory: ./adservice
        run: |
          if [ -f package.json ]; then
            npm ci
            npx eslint src
          else
            echo "No package.json found - skipping ESLint"
          fi
