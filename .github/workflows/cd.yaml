name: AdService CD

on:
  workflow_run:
    workflows: ["AdService CI/CD"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lokeshzenbook-coder/online-boutique/adservice

jobs:
  deploy:
    name: Deploy to Kind
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: adservice-cluster

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image into Kind
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main --name adservice-cluster

      - name: Deploy to cluster
        run: |
          kubectl apply -f k8s/adservice-deployment.yaml
          kubectl apply -f k8s/adservice-service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/adservice --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -l app=adservice -o wide
          echo ""
          echo "=== Service ==="
          kubectl get svc adservice
          echo ""
          echo "=== Deployment ==="
          kubectl get deployment adservice
